<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="checkout">
        <h2>Review & Place your Order</h2>

        <form name="checkout" id="checkout-form">
          <fieldset>
            <legend>Customer Information</legend>

            <label for="fname">
              First Name
              <input
                type="text"
                id="fname"
                name="fname"
                autocomplete="given-name"
                required
              />
            </label>

            <label for="lname">
              Last Name
              <input
                type="text"
                id="lname"
                name="lname"
                autocomplete="family-name"
                required
              />
            </label>

            <label for="street">
              Street Address
              <input
                type="text"
                id="street"
                name="street"
                autocomplete="street-address"
                required
              />
            </label>

            <label for="city">
              City
              <input
                type="text"
                id="city"
                name="city"
                autocomplete="address-level2"
                required
              />
            </label>

            <label for="state">
              State
              <input
                type="text"
                id="state"
                name="state"
                autocomplete="address-level1"
                required
              />
            </label>

            <label for="zip">
              ZIP Code
              <input
                type="text"
                id="zip"
                name="zip"
                inputmode="numeric"
                pattern="[0-9]{5}(-[0-9]{4})?"
                autocomplete="postal-code"
                required
              />
            </label>
          </fieldset>

          <fieldset>
            <legend>Payment</legend>

            <label for="cardNumber">
              Credit Card Number
              <input
                type="text"
                id="cardNumber"
                name="cardNumber"
                autocomplete="cc-number"
                required
              />
            </label>

            <label for="expiration">
              Expiration Date
              <input
                type="text"
                id="expiration"
                name="expiration"
                placeholder="MM/YY"
                autocomplete="cc-exp"
                required
              />
            </label>

            <label for="code">
              Security Code
              <input
                type="text"
                id="code"
                name="code"
                autocomplete="cc-csc"
                required
              />
            </label>
          </fieldset>

          <section class="order-summary">
            <h2>Order Summary</h2>

            <p>Subtotal: $<span class="subtotal">0.00</span></p>

            <p>Tax: $<span class="tax">0.00</span></p>

            <p>Shipping: $<span class="shipping">0.00</span></p>

            <p>Order Total: $<span class="order-total">0.00</span></p>
          </section>

          <button type="submit">Place Order</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>

    <script type="module" src="../js/checkout.js"></script>
  </body>
</html>
