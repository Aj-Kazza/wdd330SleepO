<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="checkout">
        <h2>Review & Place your Order</h2>

        <form name="checkout" id="checkout-form">
          <fieldset>
            <legend>Customer Information</legend>

            <label for="fname">
              First Name
              <input type="text" id="fname" name="fname" required />
            </label>

            <label for="lname">
              Last Name
              <input type="text" id="lname" name="lname" required />
            </label>

            <label for="street">
              Street Address
              <input type="text" id="street" name="street" required />
            </label>

            <label for="city">
              City
              <input type="text" id="city" name="city" required />
            </label>

            <label for="state">
              State
              <input type="text" id="state" name="state" required />
            </label>

            <label for="zip">
              ZIP Code
              <input type="text" id="zip" name="zip" required />
            </label>
          </fieldset>

          <fieldset>
            <legend>Payment</legend>

            <label for="cardNumber">
              Credit Card Number
              <input type="text" id="cardNumber" name="cardNumber" required />
            </label>

            <label for="expiration">
              Expiration Date
              <input
                type="text"
                id="expiration"
                name="expiration"
                placeholder="MM/YY"
                required
              />
            </label>

            <label for="code">
              Security Code
              <input type="text" id="code" name="code" required />
            </label>
          </fieldset>

          <section class="order-summary">
            <h2>Order Summary</h2>

            <p>Subtotal: $<span class="subtotal">0.00</span></p>

            <p>Tax: $<span class="tax">0.00</span></p>

            <p>Shipping: $<span class="shipping">0.00</span></p>

            <p>Order Total: $<span class="order-total">0.00</span></p>
          </section>

          <button type="submit">Place Order</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>

    <script type="module" src="../js/checkout.js"></script>
  </body>
</html>
